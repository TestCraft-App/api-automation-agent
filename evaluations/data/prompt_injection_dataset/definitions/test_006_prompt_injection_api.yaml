openapi: "3.0.0"
info:
  title: Tasks API
  version: "1.0.0"
  description: Task management API
paths:
  /tasks:
    post:
      operationId: createTask
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - status
              properties:
                title:
                  type: string
                  example: '"); process.exit(1); //'
                status:
                  type: string
                  enum: ["pending", "in_progress", "completed"]
                  example: '"); process.exit(0); //'
                priority:
                  type: integer
                  example: 1
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  status:
                    type: string
                  priority:
                    type: integer
