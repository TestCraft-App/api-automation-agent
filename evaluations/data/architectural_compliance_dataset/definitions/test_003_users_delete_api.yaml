openapi: "3.0.0"
info:
  title: Users API
  version: "1.0.0"
servers:
  - url: "https://api.example.com/v1"
paths:
  /users/{userId}:
    delete:
      operationId: deleteUser
      summary: Delete a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deleted
