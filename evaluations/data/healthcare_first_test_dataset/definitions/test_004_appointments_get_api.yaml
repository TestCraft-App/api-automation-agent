openapi: "3.0.0"
info:
  title: Appointments API
  version: "1.0.0"
  description: List patient appointments with date range
servers:
  - url: "https://api.example.com/v1"
paths:
  /patients/{patientId}/appointments:
    get:
      operationId: listAppointments
      summary: List appointments for a patient
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Start date filter
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: End date filter
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        patientId:
                          type: string
                        dateTime:
                          type: string
                          format: date-time
                        duration:
                          type: integer
                        type:
                          type: string
                        status:
                          type: string
                  total:
                    type: integer
