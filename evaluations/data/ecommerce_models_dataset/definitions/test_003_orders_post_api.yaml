openapi: "3.0.0"
info:
  title: Orders API
  version: "1.0.0"
  description: E-commerce Orders API with nested objects
servers:
  - url: "https://api.example.com/v1"
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - customerId
                - shippingAddress
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                      unitPrice:
                        type: number
                customerId:
                  type: string
                shippingAddress:
                  type: object
                  required:
                    - street
                    - city
                    - zipCode
                    - country
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    zipCode:
                      type: string
                    country:
                      type: string
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: string
                        quantity:
                          type: integer
                        unitPrice:
                          type: number
                  customerId:
                    type: string
                  shippingAddress:
                    type: object
                    properties:
                      street:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      zipCode:
                        type: string
                      country:
                        type: string
                  status:
                    type: string
                    enum:
                      - pending
                      - confirmed
                      - shipped
                      - delivered
                      - cancelled
                  totalAmount:
                    type: number
                  createdAt:
                    type: string
                    format: date-time
