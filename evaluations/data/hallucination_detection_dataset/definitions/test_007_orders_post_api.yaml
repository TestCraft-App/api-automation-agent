openapi: "3.0.0"
info:
  title: Orders API
  version: "1.0.0"
  description: Orders API with readOnly fields
servers:
  - url: "https://api.example.com/v1"
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productName
                - quantity
              properties:
                id:
                  type: string
                  readOnly: true
                productName:
                  type: string
                quantity:
                  type: integer
                createdAt:
                  type: string
                  format: date-time
                  readOnly: true
                updatedAt:
                  type: string
                  format: date-time
                  readOnly: true
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  productName:
                    type: string
                  quantity:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
