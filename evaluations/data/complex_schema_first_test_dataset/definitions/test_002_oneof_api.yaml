openapi: "3.0.0"
info:
  title: Notifications API
  version: "1.0.0"
  description: Notification API with oneOf schema
servers:
  - url: "https://api.example.com/v1"
paths:
  /notifications:
    post:
      operationId: sendNotification
      summary: Send a notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/EmailNotification'
                - $ref: '#/components/schemas/SMSNotification'
                - $ref: '#/components/schemas/PushNotification'
              discriminator:
                propertyName: type
      responses:
        "201":
          description: Notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  status:
                    type: string
                    enum:
                      - sent
                      - queued
                      - failed
                  sentAt:
                    type: string
                    format: date-time
components:
  schemas:
    EmailNotification:
      type: object
      required:
        - type
        - to
        - subject
        - body
      properties:
        type:
          type: string
          enum: ["email"]
        to:
          type: string
          format: email
        subject:
          type: string
        body:
          type: string
    SMSNotification:
      type: object
      required:
        - type
        - phoneNumber
        - message
      properties:
        type:
          type: string
          enum: ["sms"]
        phoneNumber:
          type: string
        message:
          type: string
    PushNotification:
      type: object
      required:
        - type
        - deviceToken
        - title
        - body
      properties:
        type:
          type: string
          enum: ["push"]
        deviceToken:
          type: string
        title:
          type: string
        body:
          type: string
