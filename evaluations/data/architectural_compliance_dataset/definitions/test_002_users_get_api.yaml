openapi: "3.0.0"
info:
  title: Users API
  version: "1.0.0"
servers:
  - url: "https://api.example.com/v1"
paths:
  /users/{userId}:
    get:
      operationId: getUserById
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  age:
                    type: integer
