openapi: "3.0.0"
info:
  title: Health Check API
  version: "1.0.0"
  description: Simple health check endpoint with no authentication
servers:
  - url: "https://api.example.com/v1"
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get health status
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number
