openapi: "3.0.0"
info:
  title: Patients API
  version: "1.0.0"
  description: Get patient by ID
servers:
  - url: "https://api.example.com/v1"
paths:
  /patients/{patientId}:
    get:
      operationId: getPatientById
      summary: Get patient details
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Patient details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  firstName:
                    type: string
                  lastName:
                    type: string
                  dateOfBirth:
                    type: string
                    format: date
                  gender:
                    type: string
                  allergies:
                    type: array
                    items:
                      type: string
                  emergencyContact:
                    type: object
                    properties:
                      name:
                        type: string
                      phone:
                        type: string
                      relationship:
                        type: string
