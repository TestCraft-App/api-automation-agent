openapi: "3.0.0"
info:
  title: Users API
  version: "1.0.0"
servers:
  - url: "https://api.example.com/v1"
paths:
  /users/{userId}:
    patch:
      operationId: patchUser
      summary: Partially update a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                age:
                  type: integer
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  age:
                    type: integer
